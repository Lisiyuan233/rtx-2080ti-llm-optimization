name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py

  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch against pinned llama.cpp base
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git upstream-llama.cpp
          git -C upstream-llama.cpp checkout 9723942
          git -C upstream-llama.cpp apply --check ../patches/llama.cpp/0001-ggml-cuda-add-NVLink-P2P-allreduce-path-for-2-GPU-t.patch
          git -C upstream-llama.cpp apply --check ../patches/llama.cpp/experimental/0001-ggml-cuda-bucket-graph-cache-by-leading-shape.patch
